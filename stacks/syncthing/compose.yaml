services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: homelab
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./config:/var/syncthing/config
      - /srv/sync:/var/syncthing/data
